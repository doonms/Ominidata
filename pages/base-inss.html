<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Base de Dados INSS — Ominidata</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Botão e menu lateral -->
  <button class="menu-btn" id="menuBtn">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <!-- Conteúdo principal -->
  <div class="wrap">
    <div class="header">
      <div class="logo-wrap">
        <div class="rot-bg"></div>
        <img src="../imagens/logos/logo.png" class="logo-img" alt="Logo">
      </div>
      <h1>Base de Dados INSS</h1>
    </div>

    <div style="margin-bottom:12px;">
      <button id="uploadBaseInssBtn" class="btn">📤 Enviar Base INSS ao Supabase</button>
      <input type="file" id="uploadBaseInssFile" accept=".json" style="display:none"/>
    </div>

    <div class="panel">
      <div class="top">
        <button id="add">+ Novo Banco</button>
        <input type="file" id="file" accept=".json">
        <button id="save">💾 Exportar</button>
      </div>
      <div id="list"></div>
    </div>
  </div>

  <!-- Imports de módulos -->
  <script type="module">
  import { criarMenuLateral } from '../js/components/menuLateral.js';
  import { initBase } from '../js/main.js';

  criarMenuLateral();
  initBase();
</script>

  </script>

  <script>
    const loginPath = window.location.pathname.includes('/pages/') ? './login.html' : './pages/login.html';
    const isLoginPage = window.location.pathname.endsWith('/login.html');
    if (!sessionStorage.getItem('ominidata_user') && !isLoginPage) {
      window.location.href = loginPath;
    }
  </script>
</body>
</html>
