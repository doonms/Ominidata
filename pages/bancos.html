<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bancos Aceitos - Ominidata</title>

  <link rel="icon" href="../imagens/logos/logo.png" type="image/png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/filtros.css" />
  <link rel="stylesheet" href="../css/bancos.css" />
  
  <link rel="stylesheet" href="../css/layout-operacional.css">
</head>
<body class="od-page">
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="wrap" inert>
    <header class="header od-hero ">
      <div class="od-brand">
        <div class="logo-wrap"><div class="rot-bg" aria-hidden="true"></div><img src="../imagens/logos/logo.png" alt="Ominidata" class="logo-img"></div>
        <div><span class="od-eyebrow">Consulta operacional</span><h1>Bancos Aceitos</h1><p>Consulte os bancos aceitos e as restrições informadas por cada parceiro.</p></div>
      </div>
      <span class="od-badge">Central de consulta</span>
    </header>

    <div class="bancos-container">
      <p class="muted">Visualize rapidamente a lista de bancos aceitos e não aceitos por cada parceiro.</p>
      <div class="summary-panel" id="summaryPanel">
        <div class="summary-card">
          <strong>0</strong>
          <span>parceiros</span>
        </div>
        <div class="summary-card">
          <strong>0</strong>
          <span>bancos aceitos</span>
        </div>
        <div class="summary-card">
          <strong>0</strong>
          <span>bancos com restrição</span>
        </div>
      </div>
      <div class="search-bar">
        <input type="search" id="searchInput" aria-label="Buscar banco" placeholder="Buscar por banco, aceitos ou nao aceitos..." />
        <button id="showAllBtn" aria-label="Limpar busca e mostrar todos">Mostrar todos</button>
      </div>
      <div class="filter-row">
        <label class="filter-toggle">
          <input type="checkbox" id="filterAceitos" />
          Somente parceiros com bancos aceitos
        </label>
        <label class="filter-toggle">
          <input type="checkbox" id="filterRestritos" />
          Somente parceiros com restrições
        </label>
      </div>

      <div id="bankList" class="bank-list"></div>
    </div>
  </div>

  <script type="module">
    import { requirePageAccess, finishPageAccess } from '../js/auth/accessControl.js';
    import { carregarMenuLateral } from "../js/components/menuLateral.js";
    import { initBancos } from "../js/bancos/bancos.js";

    (async () => {
      if (!await requirePageAccess()) return;
      carregarMenuLateral();
      await initBancos();
      finishPageAccess();
    })();
  </script>
</body>
</html>
