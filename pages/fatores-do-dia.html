<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Base de Fatores - Ominidata</title>

  <link rel="icon" href="../imagens/logos/logo.png" type="image/png"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/simulador.css"/>
</head>
<body>
  <button class="menu-btn" id="menuBtn">&#9776;</button>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="wrap">
    <header class="header">
      <div class="logo-wrap">
        <div class="rot-bg" aria-hidden="true"></div>
        <img src="../imagens/logos/logo.png" alt="Ominidata" class="logo-img">
      </div>
      <h1>Base de Fatores</h1>
    </header>

    <div style="margin-bottom:12px;">
      <button id="uploadBaseBtn" class="btn">📤 Enviar Base ao Supabase</button>
      <input type="file" id="uploadBaseFile" accept=".json" style="display:none" />
    </div>

    <div class="panel" style="display:flex; gap:16px;">
      <!-- PAINEL LATERAL -->
      <aside style="width:260px; flex:0 0 260px;">
        <div class="grp" style="margin-bottom:12px">
          <label for="bf-buscaBanco">Buscar banco</label>
          <input type="search" id="bf-buscaBanco" placeholder="Digite para filtrar"/>
        </div>

        <div class="grp" style="margin-bottom:12px">
          <label for="bf-slBanco">Banco</label>
          <select id="bf-slBanco"></select>
        </div>

        <div class="bf-logo-box">
          <img id="bf-logoBanco" alt="Logo do banco selecionado"/>
        </div>


        <!-- SWITCHES -->
        <div class="grp" style="margin-top:10px">
          <label class="switch">
            <input type="checkbox" id="bf-swMargem" checked/>
            <span class="sw"></span>
            <span>Faz margem?</span>
          </label>
        </div>
        <div class="grp" style="margin-top:6px">
          <label class="switch">
            <input type="checkbox" id="bf-swCartao"/>
            <span class="sw"></span>
            <span>Faz cartao?</span>
          </label>
        </div>

        <!-- ACOES -->
        <div class="btn-col" style="margin-top:14px; display:flex; flex-direction:column; gap:8px">
          <button id="bf-novoBanco" class="primary">+ Novo banco</button>
          <button id="bf-removerBanco" class="danger">Remover banco</button>
          <button id="bf-salvarBanco" class="primary">Salvar banco</button>
          <button id="bf-importarBanco" class="secondary">Importar JSON</button>
          <button id="bf-exportarBanco" class="secondary">Exportar JSON</button>
        </div>
      </aside>

      <!-- CONTEUDO PRINCIPAL -->
      <main style="flex:1 1 auto; min-width:0;">
        <!-- INSS -->
        <section class="card">
          <div class="card-title" style="display:flex; align-items:center; justify-content:space-between;">
            <div>
              <strong>INSS - Fatores</strong>
            </div>
          </div>

          <!-- BLOCO MARGEM -->
          <div id="bf-blocoMargem" class="factor-block">
            <div class="subttl" style="margin-bottom:6px">Margem - prazos & fatores</div>
            <div id="bf-listaPrazosMargem" class="factor-list"></div>
            <button id="bf-addTabelaMargem" class="small primary" style="margin-top:10px">Adicionar tabela</button>
          </div>

          <!-- BLOCO CARTAO -->
          <div id="bf-blocoCartao" class="factor-block" style="margin-top:18px; display:none">
            <div class="subttl" style="margin-bottom:6px">Cartao - prazos & fatores</div>
            <div id="bf-listaPrazosCartao" class="factor-list"></div>
            <button id="bf-addTabelaCartao" class="small primary" style="margin-top:10px">Adicionar tabela</button>
          </div>
        </section>

        <!-- SEGUROS (INSS) -->
        <section class="card" style="margin-top:14px">
          <div class="card-title"><strong>Seguros (INSS)</strong></div>
          <div id="bf-listaSeguros" class="seguro-list"></div>
          <button id="bf-addSeguro" class="small primary" style="margin-top:10px">+ Adicionar seguro</button>
        </section>
      </main>
    </div>
  </div>

  <!-- SCRIPT -->
  <script type="module">
    import { carregarMenuLateral } from '../js/components/menuLateral.js';
    import * as BF from '../js/simulador/base-fatores.js';

    carregarMenuLateral();
    BF.initBaseFatores({
      els: {
        slBanco: '#bf-slBanco',
        logo: '#bf-logoBanco',
        swMargem: '#bf-swMargem',
        swCartao: '#bf-swCartao',
        blocoMargem: '#bf-blocoMargem',
        listaPrazosMargem: '#bf-listaPrazosMargem',
        addTabelaMargem: '#bf-addTabelaMargem',
        blocoCartao: '#bf-blocoCartao',
        listaPrazosCartao: '#bf-listaPrazosCartao',
        addTabelaCartao: '#bf-addTabelaCartao',
        listaSeguros: '#bf-listaSeguros',
        addSeguro: '#bf-addSeguro',
        btnNovo: '#bf-novoBanco',
        btnRemover: '#bf-removerBanco',
        btnSalvar: '#bf-salvarBanco',
        btnImportar: '#bf-importarBanco',
        btnExportar: '#bf-exportarBanco',
        buscaBanco: '#bf-buscaBanco'
      }
    });
  </script>
  <script>
    const loginPath = window.location.pathname.includes('/pages/') ? './login.html' : './pages/login.html';
    const isLoginPage = window.location.pathname.endsWith('/login.html');
    if (!sessionStorage.getItem('ominidata_user') && !isLoginPage) {
      window.location.href = loginPath;
    }
  </script>
</body>
</html>
