<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <base href="../">
  <title>Pesquisa — Ominidata</title>
  <link rel="icon" href="../imagens/logos/logo.png" type="image/png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/filtros.css" />
  <link rel="stylesheet" href="../css/pesquisa.css" />
</head>
<body>
  <button class="menu-btn" id="menuBtn">☰</button>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="wrap pesquisa-wrap">
    <!-- Topo fixo -->
    <header class="pesquisa-header">
      <div class="logo-block">
        <div class="logo-wrap">
          <div class="rot-bg" aria-hidden="true"></div>
          <img src="../imagens/logos/logo.png" alt="Ominidata" class="logo-img" />
        </div>
        <h1>Ominidata</h1>
      </div>

      <div class="mode-switch">
        <label class="switch">
          <input type="radio" name="modoPesquisa" value="rapido" checked />
          <span class="track"><span class="thumb"></span></span><span>Rápido</span>
        </label>
        <label class="switch">
          <input type="radio" name="modoPesquisa" value="basico" />
          <span class="track"><span class="thumb"></span></span><span>Básico</span>
        </label>
        <label class="switch">
          <input type="radio" name="modoPesquisa" value="avancado" />
          <span class="track"><span class="thumb"></span></span><span>Avançado</span>
        </label>
        <input type="checkbox" id="f-advanced" hidden />
      </div>
    </header>

    <!-- Corpo em duas colunas -->
    <main class="pesquisa-main">
      <!-- Painel lateral de filtros -->
      <aside class="filtros-pane">
        <div class="grp">
          <label for="f-idade">Idade</label>
          <input type="number" id="f-idade" min="0" placeholder="Ex.: 75" />
        </div>
        <div class="grp">
          <label for="f-especie">Espécie</label>
          <select id="f-especie">
            <option value="geral">Geral</option>
            <option value="loas">LOAS</option>
            <option value="invalidez">Invalidez</option>
            <option value="pensao">Pensão</option>
          </select>
        </div>
        <div class="grp">
          <label for="f-assina">Cliente assina?</label>
          <select id="f-assina">
            <option value="qualquer">Qualquer</option>
            <option value="sim">Sim</option>
            <option value="nao">Não</option>
          </select>
        </div>

        <div class="grp">
          <label for="f-nome">Banco</label>
          <input type="text" id="f-nome" placeholder="Ex.: Banco XPTO" />
        </div>

        <div class="grp">
          <label>Produtos</label>
          <div class="prod-grid">
            <label><input type="checkbox" id="p-margem"> Margem</label>
            <label><input type="checkbox" id="p-cartao"> Cartão</label>
            <label><input type="checkbox" id="p-refin"> Refin</label>
            <label><input type="checkbox" id="p-port"> Portabilidade</label>
            <label><input type="checkbox" id="p-saque"> Saque compl.</label>
          </div>
        </div>

        <div class="filter-buttons">
          <button id="btn-search">Pesquisar</button>
          <button id="btn-clear" class="ghost">Limpar</button>
        </div>
      </aside>

      <!-- Área principal de resultados -->
      <section class="resultados-pane">
        <div id="results" class="results-area"></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { carregarMenuLateral } from '../js/components/menuLateral.js';
    import { initFiltros } from '../js/filtros/filtros.js';
    import { carregarBaseInss } from '../js/api/baseInssApi.js';
    import { BASE_INSS_KEY, BASE_INSS_MIRRORS } from '../js/config/storageKeys.js';
    import '../js/filtros/rapido.js';
    import '../js/filtros/avancado.js';
    import '../js/filtros/modos-bridge.js';
    import '../js/filtros/basico.js';

    async function ensureBaseInssCache() {
      try {
        const baseInss = await carregarBaseInss();
        const list = Array.isArray(baseInss)
          ? baseInss
          : (baseInss && typeof baseInss === 'object') ? Object.values(baseInss) : [];
        const payload = JSON.stringify(list);
        localStorage.setItem(BASE_INSS_KEY, payload);
        for (const mirror of BASE_INSS_MIRRORS) {
          localStorage.setItem(mirror, payload);
        }
      } catch (err) {
        console.error('Falha ao carregar base INSS', err);
      }
    }

    (async () => {
      carregarMenuLateral();
      await ensureBaseInssCache();
      initFiltros({
        resultsEl: '#results',
        triggerBtn: '#btn-search',
        controls: {
          idade: '#f-idade',
          especie: '#f-especie',
          assina: '#f-assina',
          nome: '#f-nome',
          prods: {
            margem: '#p-margem',
            cartao: '#p-cartao',
            refin:  '#p-refin',
            port:   '#p-port',
            saque:  '#p-saque'
          },
          advanced: '#f-advanced'
        }
      });
    })();
  </script>
  <script>
    const loginPath = window.location.pathname.includes('/pages/') ? './login.html' : './pages/login.html';
    const isLoginPage = window.location.pathname.endsWith('/login.html');
    if (!sessionStorage.getItem('ominidata_user') && !isLoginPage) {
      window.location.href = loginPath;
    }
  </script>
</body>
</html>
