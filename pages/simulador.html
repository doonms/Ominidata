<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <base href="../" />
  <title>Simulador - Ominidata</title>
  <link rel="icon" href="../imagens/logos/logo.png" type="image/png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/simulador.css" />
</head>
<body>
  <button class="menu-btn" id="menuBtn">Menu</button>
  <nav class="sidebar" id="sidebar"></nav>

  <div class="wrap">
    <header class="header">
      <div class="logo-wrap">
        <div class="rot-bg" aria-hidden="true"></div>
        <img src="../imagens/logos/logo.png" alt="Ominidata" class="logo-img" />
      </div>
      <h1>Simulador INSS</h1>
    </header>

    <div class="panel simulador-container">
      <aside class="simulador-side">
        <div class="grp">
          <label for="slBanco">Banco</label>
          <select id="slBanco"></select>
        </div>

        <div class="grp">
          <label for="slPrazo">Prazo</label>
          <select id="slPrazo"></select>
        </div>

        <div class="grp">
          <label>Modos de calculo</label>
          <div class="toggle-col">
            <label class="switch">
              <input type="radio" name="calcMode" id="modoParcela" value="parcela" checked />
              <span class="sw"></span>
              <span>Calcular parcela</span>
            </label>
            <label class="switch">
              <input type="radio" name="calcMode" id="modoLiberado" value="liberado" />
              <span class="sw"></span>
              <span>Calcular valor liberado</span>
            </label>
            <label class="switch" id="grpCartaoSwitch">
              <input type="checkbox" id="swCartao" />
              <span class="sw"></span>
              <span>Cartao</span>
            </label>
          </div>
        </div>

        <div class="grp" id="grpValorDesejado">
          <label for="inpValorDesejado">Valor liberado (R$)</label>
          <input type="number" id="inpValorDesejado" min="0" step="0.01" />
        </div>

        <div class="grp" id="grpValorMargem" style="display:none">
          <label for="inpValorMargem">Valor da margem (R$)</label>
          <input type="number" id="inpValorMargem" min="0" step="0.01" />
        </div>

        <div class="grp">
          <label for="slSeguro">Seguro</label>
          <select id="slSeguro">
            <option value="">Sem seguro</option>
          </select>
        </div>

        <div class="grp">
          <button id="btnSimular" class="primary" style="width:100%">Simular</button>
        </div>
      </aside>

      <main class="simulador-main">
        <section class="card resultado-card">
          <div class="card-title">
            <strong>Resultado da simulacao</strong>
          </div>

          <div class="resultado-logo">
            <img id="resLogoBanco" alt="Logo do banco" />
          </div>

          <div class="resultado-grid">
            <div><span>Valor liberado:</span> <strong id="resValor">-</strong></div>
            <div><span>Prazo:</span> <strong id="resPrazo">-</strong></div>
            <div><span id="resParcelaLabel">Valor da parcela:</span> <strong id="resParcela">-</strong></div>
            <div><span>Taxa:</span> <strong id="resTaxa">-</strong></div>
            <div><span>Plano/Tabela:</span> <strong id="resPlano">-</strong></div>
            <div><span>Seguro:</span> <strong id="resSeguro">Sem seguro</strong></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module">
    import { carregarMenuLateral } from "../js/components/menuLateral.js";
    import * as Sim from "../js/simulador/index.js";

    carregarMenuLateral();
    Sim.initSimulador();
  </script>
  <script>
    const loginPath = window.location.pathname.includes('/pages/') ? './login.html' : './pages/login.html';
    const isLoginPage = window.location.pathname.endsWith('/login.html');
    if (!sessionStorage.getItem('ominidata_user') && !isLoginPage) {
      window.location.href = loginPath;
    }
  </script>
</body>
</html>
