<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar — Ominidata</title>
  <link rel="icon" href="../imagens/logos/logo.png" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/layout-operacional.css">
</head>
<body class="od-page od-login">
  <main class="login-box">
    <div class="od-login-brand">
      <div class="logo-wrap"><div class="rot-bg" aria-hidden="true"></div><img src="../imagens/logos/logo.png" class="logo-img" alt="Ominidata"></div>
      <span class="od-eyebrow">Sua central operacional</span>
      <h1>Bem-vindo ao Ominidata</h1>
      <p>Entre para consultar regras, organizar suas bases e preparar simulações.</p>
    </div>
    <label for="email">Usuário ou e-mail</label>
    <input type="text" id="email" placeholder="maria.silva ou seu e-mail atual" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254">
    <label for="senha">Senha</label>
    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
    <button type="button" class="login-btn" id="loginBtn">Entrar</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
