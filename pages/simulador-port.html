<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador Portabilidade</title>

<style>
body{
    background:#1b1b1b;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.container{
    width:500px;
    margin:40px auto;
    background:#2b2b2b;
    padding:25px;
    border-radius:10px;
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:6px;
    border:none;
    box-sizing:border-box;
    font-size:16px;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:8px;
    background:#0b7dda;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#095fa4;
}

.resultado{
    margin-top:25px;
    background:#181818;
    padding:20px;
    border-radius:8px;
}

.valor{
    font-size:32px;
    color:#00ff88;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Simulador Portabilidade</h2>

<label>Valor da Parcela</label>
<input
id="parcela"
type="number"
step="0.01"
value="401.93">

<label>Parcelas Restantes</label>
<input
id="parcelas"
type="number"
value="51">

<label>Taxa (% ao mês)</label>
<input
id="taxa"
type="number"
step="0.001"
value="1.844">

<label>Data Base</label>
<input
id="dataBase"
type="date">

<label>Primeiro Vencimento</label>
<input
id="primeiroVencimento"
type="date">

<button onclick="calcular()">
Calcular Saldo
</button>

<div class="resultado">

<div>Saldo Calculado</div>

<div
id="saldo"
class="valor">
R$ 0,00
</div>

</div>

</div>

<script>

const FATOR_CORRECAO_SALDO = 0.99306;
const FATOR_LIBERACAO = 0.308;

const hoje = new Date();

document.getElementById("dataBase").value =
hoje.toISOString().split("T")[0];

const primeiro = new Date();

primeiro.setMonth(primeiro.getMonth()+1);

document.getElementById("primeiroVencimento").value =
primeiro.toISOString().split("T")[0];

function criarCampoValorLiberado(){

    // Garante que o campo estimado exista sem alterar o HTML estatico.
    if(document.getElementById("valorLiberado")){
        return;
    }

    const saldo = document.getElementById("saldo");
    const label = document.createElement("div");
    const valor = document.createElement("div");

    label.textContent = "Valor Liberado";
    valor.id = "valorLiberado";
    valor.className = "valor";
    valor.textContent = formatarMoeda(0);

    saldo.insertAdjacentElement("afterend", valor);
    valor.insertAdjacentElement("beforebegin", label);
}

function calcularSaldo(parcela, parcelas, taxaMensal, dataBase, primeira){

    // Converte a taxa mensal informada em percentual para decimal.
    const taxa = taxaMensal / 100;

    // Transforma a taxa mensal em fator diario.
    const fatorDiario = Math.pow(1 + taxa, 1 / 30);

    let saldo = 0;

    // Traz cada parcela futura para valor presente e soma o saldo.
    for(let i = 0; i < parcelas; i++){

        const vencimento = new Date(primeira);
        vencimento.setMonth(vencimento.getMonth() + i);

        const dias = Math.round((vencimento - dataBase) / 86400000);

        saldo += parcela / Math.pow(fatorDiario, dias);
    }

    // Ajuste temporario para aproximar o simulador oficial do C6.
    return saldo * FATOR_CORRECAO_SALDO;
}

function calcularValorLiberado(saldoCalculado){

    // Estima a liberacao por aproximacao linear baseada no saldo.
    return saldoCalculado * FATOR_LIBERACAO;
}

function formatarMoeda(valor){

    // Formata valores monetarios no padrao brasileiro.
    return valor.toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });
}

function calcular(){

    const parcela = parseFloat(document.getElementById("parcela").value);
    const parcelas = parseInt(document.getElementById("parcelas").value);
    const taxaMensal = parseFloat(document.getElementById("taxa").value);

    const dataBase = new Date(document.getElementById("dataBase").value);
    const primeira = new Date(document.getElementById("primeiroVencimento").value);

    // Calcula o saldo e a liberacao estimada em etapas separadas.
    const saldoCalculado = calcularSaldo(parcela, parcelas, taxaMensal, dataBase, primeira);
    const valorLiberado = calcularValorLiberado(saldoCalculado);

    document.getElementById("saldo").innerHTML = formatarMoeda(saldoCalculado);
    document.getElementById("valorLiberado").innerHTML = formatarMoeda(valorLiberado);
}

criarCampoValorLiberado();
calcular();

</script>

</body>
</html>
